<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The patrol stack</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.pd-bore{fill:var(--anatomy-shade-0);stroke:none}
.pd-pennant{fill:var(--anatomy-lit-top);stroke:none}

.pd-goal{stroke-width:.8px}
.pd-fan{fill:var(--anatomy-lit);opacity:.09;stroke:none}

.pd-leg{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:none}

.pd-foot{fill:var(--anatomy-hi);stroke:none}

@keyframes pd-think{0%,100%{opacity:.2}50%{opacity:.85}}
.pd-key,.pd-slide,[data-part="barrier"]{cursor:pointer}
[data-lamp]{transition:none}
.iso-plate{padding:42px 20px 40px}
@media (max-width:560px){.iso-plate{padding:40px 10px 64px}}
.iso-stage{touch-action:pan-y;outline:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.pd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pd-grille[data-thinking] circle{animation:none;opacity:.6}}

</svg>System 3 · LLM: picks the goal, passes constraints</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>System 2 · planner (SLAM / EKF + Nav2): picks the path</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>System 1 · lidar + control: drives the dog</span></span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));

// The patrol stack: the floor plan, the planner and the walk, as one pure
// module. build.mjs imports it to lay out the building; the page inlines the
// same source (export stripped) so the live planner is the one drawn here.
//
// The building is a grid of cells. Cells in one room are open to each other;
// cells in different rooms are walled, except through a door. The planner is a
// breadth-first search over that graph (an occupancy-grid planner in
// miniature), started from wherever the dog stands, and it honours exactly one
// kind of constraint the dispatcher may pass: a closed corridor edge.

const CELL = 36;
const COLS = 5;
const ROWS = 4;
const GX = -90;
const GY = -90;

// Rooms by cell. "cn" and "cs" are the north and south corridors.
const ROOMS = {
  nw: [[0, 0], [1, 0]],
  north: [[2, 0], [3, 0], [4, 0]],
  cn: [[0, 1], [1, 1], [2, 1], [3, 1]],
  dock: [[0, 2]],
  hall: [[1, 2], [2, 2], [3, 2]],
  east: [[4, 1], [4, 2], [4, 3]],
  cs: [[0, 3], [1, 3], [2, 3], [3, 3]],
};

// Doors between rooms: pairs of cells.
const DOORS = [
  [[1, 0], [1, 1]],
  [[2, 0], [2, 1]],
  [[0, 2], [0, 1]],
  [[0, 2], [0, 3]],
  [[2, 2], [2, 1]],
  [[2, 2], [2, 3]],
  [[4, 1], [3, 1]],
  [[4, 3], [3, 3]],
];

// The one corridor edge the dispatcher can close.
const BARRIER = [[0, 1], [1, 1]];

// Where the dispatcher can send the dog: the cell it stands in and the socket
// its flag is planted in (behind and left of that spot, so the dog stops in
// front of it).
const ZONES = [
  { id: "east", name: "east room", cell: [4, 2] },
  { id: "north", name: "north room", cell: [2, 0] },
  { id: "hall", name: "hall", cell: [2, 2] },
  { id: "dock", name: "dock", cell: [0, 2] },
];
const FLAG_OFFSET = [-10, -10];

const centreOf = ([c, r]) => [GX + CELL * (c + 0.5), GY + CELL * (r + 0.5)];
const keyOf = ([c, r]) => c + "," + r;
const roomOf = (cell) => {
  for (const name in ROOMS) if (ROOMS[name].some(([c, r]) => c === cell[0] && r === cell[1])) return name;
  return null;
};
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const edgeIs = (a, b, [p, q]) => (same(a, p) && same(b, q)) || (same(a, q) && same(b, p));
const isDoor = (a, b) => DOORS.some((door) => edgeIs(a, b, door));
const isBarrier = (a, b) => edgeIs(a, b, BARRIER);

// Neighbours in a fixed order (north, east, south, west), so ties break the
// same way every time: the north corridor wins an even race.
function neighbours(cell, closed) {
  const out = [];
  for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
    const next = [cell[0] + dc, cell[1] + dr];
    if (next[0] < 0 || next[1] < 0 || next[0] >= COLS || next[1] >= ROWS) continue;
    const open = roomOf(next) === roomOf(cell) || isDoor(cell, next);
    if (!open) continue;
    if (closed && isBarrier(cell, next)) continue;
    out.push(next);
  }
  return out;
}

// Cells from start to goal, or null.
function search(start, goal, closed) {
  const seen = { [keyOf(start)]: null };
  const queue = [start];
  while (queue.length) {
    const cell = queue.shift();
    if (same(cell, goal)) {
      const path = [cell];
      let key = keyOf(cell);
      while (seen[key]) {
        path.unshift(seen[key]);
        key = keyOf(seen[key]);
      }
      return path;
    }
    for (const next of neighbours(cell, closed)) {
      const key = keyOf(next);
      if (key in seen) continue;
      seen[key] = cell;
      queue.push(next);
    }
  }
  return null;
}

const cellAt = ([x, y]) => [
  Math.max(0, Math.min(COLS - 1, Math.floor((x - GX) / CELL))),
  Math.max(0, Math.min(ROWS - 1, Math.floor((y - GY) / CELL))),
];

// The route from where the dog stands now. `from` and `to` are the cells of
// the leg it is on (the same cell when it stands still), `at` its position.
// It may go on to `to` or turn back to `from`, whichever is shorter, but never
// across a closed edge.
function plan(at, from, to, goal, closed) {
  const options = [];
  for (const cell of same(from, to) ? [from] : [from, to]) {
    const path = search(cell, goal, closed);
    if (!path) continue;
    const [cx, cy] = centreOf(cell);
    options.push({ path, cost: Math.hypot(cx - at[0], cy - at[1]) + (path.length - 1) * CELL });
  }
  if (!options.length) return null;
  options.sort((a, b) => a.cost - b.cost);
  const cells = options[0].path;
  const points = [at, ...cells.map(centreOf)].filter((p, i, list) => i === 0 || Math.hypot(p[0] - list[i - 1][0], p[1] - list[i - 1][1]) > 1);
  return { cells, points: round(points, 11) };
}

// Round every corner with an arc of `radius`, clamped to the legs; a
// turn-back (over 150°) keeps its corner, where the dog stops and turns.
function round(points, radius, perArc = 8) {
  if (points.length < 3) return points.slice();
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const [a, b, c] = [points[i - 1], points[i], points[i + 1]];
    const u = [a[0] - b[0], a[1] - b[1]];
    const v = [c[0] - b[0], c[1] - b[1]];
    const lu = Math.hypot(...u);
    const lv = Math.hypot(...v);
    const cos = (u[0] * v[0] + u[1] * v[1]) / (lu * lv);
    const turn = Math.PI - Math.acos(Math.max(-1, Math.min(1, cos)));
    if (turn < 0.05 || turn > (150 * Math.PI) / 180) {
      out.push(b);
      continue;
    }
    const half = (Math.PI - turn) / 2;
    const cut = Math.min(radius / Math.tan(half), lu * 0.48, lv * 0.48);
    const r = cut * Math.tan(half);
    const p = [b[0] + (u[0] / lu) * cut, b[1] + (u[1] / lu) * cut];
    const q = [b[0] + (v[0] / lv) * cut, b[1] + (v[1] / lv) * cut];
    const bis = [u[0] / lu + v[0] / lv, u[1] / lu + v[1] / lv];
    const lb = Math.hypot(...bis);
    const o = [b[0] + (bis[0] / lb) * Math.hypot(cut, r), b[1] + (bis[1] / lb) * Math.hypot(cut, r)];
    let a0 = Math.atan2(p[1] - o[1], p[0] - o[0]);
    let a1 = Math.atan2(q[1] - o[1], q[0] - o[0]);
    let d = a1 - a0;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    for (let s = 0; s <= perArc; s++) out.push([o[0] + r * Math.cos(a0 + (d * s) / perArc), o[1] + r * Math.sin(a0 + (d * s) / perArc)]);
  }
  out.push(points[points.length - 1]);
  return out;
}

function lengthsOf(points) {
  const out = [0];
  for (let i = 1; i < points.length; i++) out.push(out[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
  return out;
}

// Position, heading and leg index at arc length s.
function sample(points, lengths, s) {
  const total = lengths[lengths.length - 1];
  s = Math.max(0, Math.min(total, s));
  let i = 1;
  while (i < points.length - 1 && lengths[i] < s) i++;
  const span = lengths[i] - lengths[i - 1] || 1;
  const t = (s - lengths[i - 1]) / span;
  const [a, b] = [points[i - 1], points[i]];
  return { at: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], heading: Math.atan2(b[1] - a[1], b[0] - a[0]), index: i };
}

function cut(points, lengths, from, to) {
  const out = [sample(points, lengths, from).at];
  for (let i = 0; i < points.length; i++) if (lengths[i] > from + 1e-6 && lengths[i] < to - 1e-6) out.push(points[i]);
  out.push(sample(points, lengths, to).at);
  return out;
}

// Wall boxes on the floor, for the drawing and for the lidar. Exterior walls
// are thicker; every grid corner a wall meets gets a post; a door leaves a
// gap with a jamb at each side.
const WALL_T = 2.4;
const OUTER_T = 3.2;
const POST = 4.6;
const DOOR = 16;
const JAMB = 1.6;

function wallEdges() {
  const edges = [];
  const roomAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS ? "outside" : roomOf([c, r]));
  for (let r = 0; r < ROWS; r++) {
    for (let c = -1; c < COLS; c++) {
      const [a, b] = [roomAt(c, r), roomAt(c + 1, r)];
      if (a === b) continue;
      const outer = a === "outside" || b === "outside";
      edges.push({ axis: "y", x: GX + CELL * (c + 1), y0: GY + CELL * r, y1: GY + CELL * (r + 1), outer, door: !outer && isDoor([c, r], [c + 1, r]) });
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = -1; r < ROWS; r++) {
      const [a, b] = [roomAt(c, r), roomAt(c, r + 1)];
      if (a === b) continue;
      const outer = a === "outside" || b === "outside";
      edges.push({ axis: "x", y: GY + CELL * (r + 1), x0: GX + CELL * c, x1: GX + CELL * (c + 1), outer, door: !outer && isDoor([c, r], [c, r + 1]) });
    }
  }
  return edges;
}

// Boxes { x0, y0, x1, y1, kind } for every wall piece, post and jamb.
function wallBoxes() {
  const boxes = [];
  const posts = new Map();
  const half = POST / 2;
  for (const e of wallEdges()) {
    const t = (e.outer ? OUTER_T : WALL_T) / 2;
    if (e.axis === "y") {

}

// Distance along a ray from o in direction d to the first box, or Infinity.
function rayHit(o, d, boxes, range) {
  let best = range;
  for (const b of boxes) {
    let t0 = 0;
    let t1 = best;
    for (const [oo, dd, lo, hi] of [[o[0], d[0], b.x0, b.x1], [o[1], d[1], b.y0, b.y1]]) {
      if (Math.abs(dd) < 1e-9) {
        if (oo < lo || oo > hi) { t0 = Infinity; break; }
        continue;
      }
      let a = (lo - oo) / dd;
      let c = (hi - oo) / dd;
      if (a > c) [a, c] = [c, a];
      t0 = Math.max(t0, a);
      t1 = Math.min(t1, c);
      if (t0 > t1) break;
    }
    if (t0 <= t1 && t0 < best) best = t0;
  }
  return best;
}

  else if (step[0] === "routed") done = settled() && !!planner.route;
  else if (step[0] === "arrive") done = settled() && !planner.route && dog.arrived && planner.old === 0;
  if (done) tourAt = (tourAt + 1) % TOUR.length;
}
function takeOver() {
  touring = false;
  quiet = 0;
}

// ---- Loop -----------------------------------------------------------------------
let frame = 0, last = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  clock += dt;
  if (touring && !calm) tourStep(dt);
  else if (!calm) {
    quiet += dt;
    if (quiet > 12 && settled() && dog.arrived) { touring = true; tourAt = TOUR.length - 3; }
  }
  consoleStep(dt, calm);
  plannerStep(dt, calm);
  dogStep(dt, calm);
  draw(calm);
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function draw(calm) {
  drawConsole();
  drawRoute();
  drawLidar(calm);
  drawDog();
  drawReadout();
}
function run() {
  if (still.matches) { for (let i = 0; i < 4; i++) { consoleStep(0, true); plannerStep(0, true); } draw(true); return; }
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ---- Input ------------------------------------------------------------------------
function toFloor(event) {
  const m = svg.getScreenCTM();
  if (!m) return null;
  const pt = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  const { sinA, cosA, sinE, cosE, k: K } = cameraOf(P);
  const u = (pt.x - P.origin[0]) / K;
  const w = ((pt.y - P.origin[1]) / K + FZ * cosE) / sinE;
  // u = x sinA - y cosA, w = x cosA + y sinA
  return [u * sinA + w * cosA, -u * cosA + w * sinA];
}
function zone(z) { takeOver(); command({ type: "zone", z }); }
function toggle() { takeOver(); command({ type: "barrier", on: !con.want }); }
svg.addEventListener("click", (event) => {
  const key = event.target.closest("[data-zone]");
  if (key) { zone(Number(key.dataset.zone)); stage.focus({ preventScroll: true }); return; }
  if (event.target.closest('[data-part="slide"],[data-part="barrier"]')) { toggle(); stage.focus({ preventScroll: true }); return; }
  const p = toFloor(event);
  if (!p) return;
  if (p[0] < GX || p[0] > GX + COLS * CELL || p[1] < GY || p[1] > GY + ROWS * CELL) return;
  if (Math.hypot(p[0] - BARRIER_AT[0], p[1] - BARRIER_AT[1]) < 10) { toggle(); stage.focus({ preventScroll: true }); return; }
  const room = roomOf(cellAt(p));
  const z = ZONES.findIndex((zn) => zn.id === room);
  if (z >= 0) { zone(z); stage.focus({ preventScroll: true }); }
});
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "1" || key === "2" || key === "3") { event.preventDefault(); zone(Number(key) - 1); }
  else if (key === "0" || key === "d" || key === "h" || key === "home") { event.preventDefault(); zone(3); }
  else if (key === "b" || key === " ") { event.preventDefault(); toggle(); }
});
stage.addEventListener("focus", () => { status.textContent = shownText; });

// Reduced motion: one still frame that tells the whole story. The dog waits
// at its dock; the console has sent it to the east room and closed the north
// corridor, so the route runs round through the south corridor. Keys and
// clicks still change the goal and the barrier, and the route answers.
function settleStill() {
  if (!still.matches) return;
  touring = false;
  con.queue = [];
  con.task = null;
  con.lampOn = 0;
  con.lamps = [1, 0, 0];
  con.dial = DIAL_ANGLES[0];
  con.flags = [1, 0, 0, 0];
  con.planted = 0;
  con.want = true;
  con.slide = 1;
  con.barrier = 1;
  planner.goal = 0;
  planner.closed = true;
  planner.dirty = true;
  dog.pos = DOG_DOCK.slice();
  dog.heading = Math.PI / 2;
  plannerStep(0, true);
  dog.arrived = false;
  draw(true);
}
still.addEventListener("change", () => { if (still.matches) settleStill(); else { touring = true; run(); } });
draw(still.matches);
settleStill();

</script></body></html>
